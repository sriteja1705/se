services:
  # --- DATABASES & CACHE ---
  mysql_db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-net

  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: appdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-net

  redis:
    image: redis:latest
    networks:
      - app-net

  # --- WEB & APPLICATION SERVERS ---
  wordpress:
    image: wordpress:latest
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: mysql_db:3306
      WORDPRESS_DB_USER: appuser
      WORDPRESS_DB_PASSWORD: apppassword
      WORDPRESS_DB_NAME: appdb
    depends_on:
      - mysql_db
    networks:
      - app-net

  nginx:
    image: nginx:latest
    ports:
      - "8082:80"
    depends_on:
      - postgres_db
    networks:
      - app-net

  tomcat:
    image: tomcat:9-jdk17
    ports:
      - "8083:8080"
    depends_on:
      - mysql_db
    networks:
      - app-net

  flask_web:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install flask && python -c \"from flask import Flask; app=Flask(__name__); app.route('/')(lambda: 'Hello Docker Compose!'); app.run(host='0.0.0.0', port=5000)\""
    ports:
      - "5000:5000"
    depends_on:
      - postgres_db
      - redis
    networks:
      - app-net

volumes:
  mysql_data:
  pg_data:

networks:
  app-net:
